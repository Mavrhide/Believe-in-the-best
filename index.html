<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Верьте в лучшее</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --sun:#FFD84D; --ink:#1B2A4A; --paper:#FFFBEA; --alarm:#D94032; --ok:#1F8A5B; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--sun); color:var(--ink);
         font-family:"Bricolage Grotesque", system-ui, sans-serif; }
  main { width:min(560px,100%); }
  h1 { font-size:clamp(2.4rem,9vw,4rem); line-height:1; margin:0 0 8px; font-weight:800; letter-spacing:-.03em; }
  p.sub { margin:0 0 24px; font-size:1.05rem; }
  .card { background:var(--paper); border:3px solid var(--ink); border-radius:18px; padding:20px; box-shadow:6px 6px 0 var(--ink); }
  input[type=text] { width:100%; padding:12px; font:inherit; border:2px solid var(--ink); border-radius:10px; background:#fff; }
  .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  button, label.file { font:inherit; font-weight:700; padding:12px 18px; border:2px solid var(--ink);
         border-radius:10px; background:var(--ink); color:var(--paper); cursor:pointer; }
  label.file { background:transparent; color:var(--ink); }
  button:focus-visible, input:focus-visible, label.file:focus-within { outline:3px solid var(--alarm); outline-offset:2px; }
  button:disabled { opacity:.5; cursor:wait; }
  input[type=file] { position:absolute; opacity:0; width:0; height:0; }
  #out { margin-top:20px; display:none; }
  #msg { font-size:1.9rem; font-weight:800; line-height:1.1; margin:0 0 10px; }
  #msg.safe { color:var(--ok); } #msg.err, #msg.doomed { color:var(--alarm); }
  #bar { height:14px; border-radius:8px; background:var(--ok); overflow:hidden; border:2px solid var(--ink); display:none; }
  #bar i { display:block; height:100%; background:var(--alarm); }
  #stats { margin:8px 0 0; font-size:.95rem; }
  small { display:block; margin-top:16px; }
  @media (prefers-reduced-motion: no-preference) { #bar i { transition: width .8s ease; } }
</style>
</head>
<body>
<main>
  <h1>Верьте в&nbsp;лучшее</h1>
  <p class="sub">Проверяем файл на VirusTotal. Если хоть один антивирус промолчал — файл чист.</p>
  <div class="card">
    <input id="hash" type="text" placeholder="SHA-256, SHA-1 или MD5" aria-label="Хеш файла" autocomplete="off">
    <div class="row">
      <button id="go">Проверить хеш</button>
      <label class="file">Выбрать файл<input id="file" type="file"></label>
    </div>
    <div id="out" aria-live="polite">
      <p id="msg"></p>
      <div id="bar"><i></i></div>
      <p id="stats"></p>
    </div>
    <small>Файл не загружается никуда: хеш считается прямо в браузере.</small>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const go = $("go");

async function sha256(file) {
  const buf = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function show(cls, text, stats, pct) {
  $("out").style.display = "block";
  $("msg").className = cls; $("msg").textContent = text;
  $("stats").textContent = stats || "";
  $("bar").style.display = pct == null ? "none" : "block";
  if (pct != null) { $("bar").firstElementChild.style.width = "0"; requestAnimationFrame(() => $("bar").firstElementChild.style.width = pct + "%"); }
}

async function check() {
  const h = $("hash").value.trim();
  if (!h) return show("err", "Введите хеш или выберите файл.");
  go.disabled = true; show("", "Спрашиваем антивирусы…");
  try {
    const r = await fetch("/api/check/" + encodeURIComponent(h));
    const d = await r.json();
    if (!r.ok) return show("err", d.detail);
    show(d.verdict, d.message,
      `Против: ${d.malicious} из ${d.total}. Промолчали: ${d.silent}.` + (d.name ? ` Файл: ${d.name}` : ""),
      d.total ? d.malicious / d.total * 100 : 0);
  } catch { show("err", "Сервер недоступен."); }
  finally { go.disabled = false; }
}

go.onclick = check;
$("hash").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  show("", "Считаем хеш…");
  $("hash").value = await sha256(f);
  check();
};
</script>
</body>
</html>
